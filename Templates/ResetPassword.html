<html>
  <body style="font-family: Arial, sans-serif; background: #f9f9f9; padding: 40px;">
    <div style="max-width: 600px; margin: auto; background: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.05);">
      <h2 style="color: #333;">Reset Your Password</h2>
      <p style="color: #555; font-size: 16px;">
        We received a request to reset your password.<br>
        Click the button below to create a new one.
      </p>
      <p style="text-align: center;">
        <a href="{{RESET_LINK}}" style="display: inline-block; padding: 12px 24px; background-color: #007bff; color: #fff; text-decoration: none; border-radius: 5px; font-weight: bold;">
          Reset Password
        </a>
      </p>
      <p style="color: #555; font-size: 14px;">
        If you did not request this, please ignore this email.
      </p>
      <p style="color: #aaa; font-size: 12px;">
        This link will expire in 1 hour.
      </p>
    </div>
  </body>
</html>
